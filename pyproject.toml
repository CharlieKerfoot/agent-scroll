[project]
name = "doomscroll"
version = "0.1.0"
description = "Hermes Doomscroll Agent: cognitive simulation of feed consumption"
readme = "README.md"
authors = [
    { name = "charliekerfoot", email = "charliekerfoot@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.98.1",
    "numpy>=2.4.4",
    "openai>=2.34.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
doomscroll-pilot = "doomscroll.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0.12.20260408",
]
